name: Deploy — Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      job_name:
        description: "Optional staging Container App Job to start after deployment"
        required: false
        type: string
      execution_name:
        description: "Optional existing execution to monitor instead of starting a job"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: gramag72fsz9.azurecr.io
  IMAGE: gramag72fsz9.azurecr.io/gramag

jobs:
  pre-import-snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(inputs.job_name, '-import-') &&
      inputs.execution_name == ''
    uses: ./.github/workflows/backup-staging-data.yml
    secrets: inherit

  deploy:
    needs: pre-import-snapshot
    if: >-
      always() &&
      (needs.pre-import-snapshot.result == 'success' ||
       needs.pre-import-snapshot.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.execution_name == '')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - name: Checkout gramag
        uses: actions/checkout@v4

      - name: Backend syntax check
        run: python -m compileall -q .

      - name: Frontend check
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          TOKEN=$(az acr login --name gramag72fsz9 --expose-token --output tsv --query accessToken)
          echo "$TOKEN" | docker login ${{ env.ACR_LOGIN_SERVER }} --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.azure
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache-staging
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache-staging,mode=max

      - name: Checkout gramag-infra
        uses: actions/checkout@v4
        with:
          repository: softhq-io/gramag-infra
          ssh-key: ${{ secrets.INFRA_REPO_DEPLOY_KEY }}
          path: gramag-infra

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        working-directory: gramag-infra/staging
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: tofu init

      - name: tofu apply
        working-directory: gramag-infra/staging
        env:
          TF_IN_AUTOMATION: "true"
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET_STAGING }}
          TF_VAR_exxas_user: ${{ secrets.EXXAS_USER }}
          TF_VAR_exxas_password: ${{ secrets.EXXAS_PASSWORD }}
          TF_VAR_sharepoint_tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          TF_VAR_sharepoint_client_id: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          TF_VAR_sharepoint_client_secret: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
        run: tofu apply -auto-approve -var "image_tag=${{ github.sha }}"

      - name: Verify FalkorDB persistence config
        run: |
          set -euo pipefail

          mount_path="$(az containerapp show \
            --name staging-gramag-falkordb \
            --resource-group gramag-staging-rg \
            --query "properties.template.containers[0].volumeMounts[?volumeName=='falkordb-vol'].mountPath | [0]" \
            --output tsv)"
          if [ "$mount_path" != "/var/lib/falkordb/data" ]; then
            echo "FalkorDB data volume must be mounted at /var/lib/falkordb/data, got: $mount_path"
            exit 1
          fi

          redis_args="$(az containerapp show \
            --name staging-gramag-falkordb \
            --resource-group gramag-staging-rg \
            --query "properties.template.containers[0].env[?name=='REDIS_ARGS'].value | [0]" \
            --output tsv)"
          case "$redis_args" in
            *"--appendonly yes"*"--appendfsync everysec"*) ;;
            *)
              echo "FalkorDB REDIS_ARGS must enable AOF everysec, got: $redis_args"
              exit 1
              ;;
          esac

      - name: Start staging Proto ingest
        if: >-
          (github.event_name == 'push' &&
           contains(github.event.head_commit.message, '[run-proto-ingest]')) ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.job_name != '' &&
           inputs.execution_name == '')
        id: start-ingest
        env:
          JOB_NAME: ${{ inputs.job_name }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$JOB_NAME" in
              staging-sp-proto-*-pdf|staging-sp-proto-*-img)
                jobs=("$JOB_NAME")
                ;;
              *)
                echo "Unsupported staging ingest job name: $JOB_NAME"
                exit 1
                ;;
            esac
          else
            jobs=(
              staging-sp-proto-birk01-pdf
              staging-sp-proto-birk02-pdf
              staging-sp-proto-birk03-pdf
              staging-sp-proto-birk04-pdf
            )
          fi

          for job in "${jobs[@]}"; do
            execution="$(az containerapp job start \
              --name "$job" \
              --resource-group gramag-staging-rg \
              --query name \
              --output tsv)"
            echo "$execution"
            echo "execution_name=$execution" >> "$GITHUB_OUTPUT"
          done

      - name: Monitor existing staging Proto execution
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.job_name != '' &&
          inputs.execution_name != ''
        env:
          JOB_NAME: ${{ inputs.job_name }}
          EXECUTION_NAME: ${{ inputs.execution_name }}
        run: |
          set -euo pipefail

          case "$JOB_NAME" in
            staging-sp-proto-*-pdf|staging-sp-proto-*-img) ;;
            *)
              echo "Unsupported staging ingest job name: $JOB_NAME"
              exit 1
              ;;
          esac
          case "$EXECUTION_NAME" in
            "$JOB_NAME"-*) ;;
            *)
              echo "Execution does not belong to job: $EXECUTION_NAME"
              exit 1
              ;;
          esac

          show_logs() {
            az containerapp job logs show \
              --name "$JOB_NAME" \
              --resource-group gramag-staging-rg \
              --execution "$EXECUTION_NAME" \
              --container sharepoint-proto-ingest \
              --tail 200 || true
          }

          for attempt in {1..120}; do
            status="$(az containerapp job execution list \
              --name "$JOB_NAME" \
              --resource-group gramag-staging-rg \
              --query "[?name=='$EXECUTION_NAME'] | [0].properties.status" \
              --output tsv)"
            echo "$EXECUTION_NAME status=$status attempt=$attempt"
            case "$status" in
              Succeeded)
                show_logs
                exit 0
                ;;
              Failed|Stopped)
                show_logs
                exit 1
                ;;
              Running|Processing|Pending) sleep 30 ;;
              *)
                echo "Unknown or missing execution status: $status"
                exit 1
                ;;
            esac
          done

          echo "Timed out while monitoring $EXECUTION_NAME"
          exit 1

  monitor:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.job_name != '' &&
      inputs.execution_name != ''
    runs-on: ubuntu-latest

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect staging Proto execution
        env:
          JOB_NAME: ${{ inputs.job_name }}
          EXECUTION_NAME: ${{ inputs.execution_name }}
        run: |
          set -euo pipefail

          if [[ ! "$JOB_NAME" =~ ^staging-sp-proto-[a-z0-9-]+-(pdf|img)$ ]]; then
            echo "Unsupported staging ingest job name: $JOB_NAME"
            exit 1
          fi
          execution_suffix="${EXECUTION_NAME#"$JOB_NAME"-}"
          if [ "$execution_suffix" = "$EXECUTION_NAME" ] ||
             [[ ! "$execution_suffix" =~ ^[a-z0-9]+$ ]]; then
            echo "Execution does not belong to job: $EXECUTION_NAME"
            exit 1
          fi

          status="$(az containerapp job execution list \
            --name "$JOB_NAME" \
            --resource-group gramag-staging-rg \
            --query "[?name=='$EXECUTION_NAME'] | [0].properties.status" \
            --output tsv)"
          echo "$EXECUTION_NAME status=$status"

          log_dir="/data/ingest-logs/$JOB_NAME"
          curl --max-time 30 -fsS \
            "https://staging-gramag-app.politemushroom-9223672b.westeurope.azurecontainerapps.io/health" \
            >/dev/null || true
          for attempt in {1..5}; do
            if script -q -e -c \
              "az containerapp exec --resource-group gramag-staging-rg --name staging-gramag-app --container gramag-app --command 'find $log_dir -maxdepth 2 -type f -exec tail -n 200 {} +'" \
              /dev/null; then
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "Could not read durable logs: $log_dir"
              exit 1
            fi
            sleep 10
          done

          case "$status" in
            Succeeded) exit 0 ;;
            Failed|Stopped) exit 1 ;;
            Running|Processing|Pending) exit 0 ;;
            *)
              echo "Unknown or missing execution status: $status"
              exit 1
              ;;
          esac
